server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # React produit une application a page unique : toutes les URL
    # doivent renvoyer index.html, sinon un rechargement sur une
    # sous-page donnerait une erreur 404.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-tetes de securite elementaires.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
