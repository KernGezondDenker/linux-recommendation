# Resolveur DNS interne de Docker. Sans cette ligne, nginx resout le nom
# "recommendation-service" UNE SEULE FOIS au demarrage et garde l'adresse
# en cache : si le conteneur redemarre avec une autre adresse, le relais
# tombe en panne jusqu'au prochain redemarrage de nginx. Avec valid=10s,
# nginx reinterroge le DNS toutes les dix secondes.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # ------------------------------------------------------------------
    # Relais vers l'API.
    #
    # Le navigateur appelle /api/v1/... sur LA MEME ORIGINE que la page.
    # nginx transmet la requete a recommendation-service par le reseau
    # interne de Docker.
    #
    # Pourquoi ce detour plutot qu'un appel direct a l'API : le code React
    # s'execute dans le navigateur, qui ne connait ni le reseau Docker ni
    # le nom "recommendation-service". Il faudrait donc lui donner
    # l'adresse PUBLIQUE du serveur, et comme Vite inscrit cette adresse
    # dans le JavaScript AU MOMENT DU BUILD, l'image devrait etre
    # reconstruite a chaque changement d'adresse. En relayant ici, l'image
    # ne contient plus aucune adresse.
    #
    # Effet de bord bienvenu : meme origine, donc plus de CORS du tout.
    #
    # L'adresse passe par une VARIABLE. Avec une adresse ecrite en dur,
    # nginx exige que le nom soit resolvable au demarrage et refuse de
    # demarrer sinon ; avec une variable, il ne resout qu'a la premiere
    # requete, et la pile peut demarrer dans n'importe quel ordre.
    # En contrepartie nginx ne transmet plus l'URI automatiquement :
    # $request_uri la restitue, parametres de requete compris.
    # ------------------------------------------------------------------
    location /api/ {
        set $api http://recommendation-service:8082;
        proxy_pass $api$request_uri;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # La sonde exigee par le critere d'acceptation de la US #52, servie
    # sur le port public du site. Seul "health" est expose par Spring
    # (application.yml), et sans detail : aucune configuration ne fuit.
    location /actuator/health {
        set $sonde http://recommendation-service:8082;
        proxy_pass $sonde$request_uri;
        proxy_set_header Host $host;
    }

    # React produit une application a page unique : toutes les autres URL
    # doivent renvoyer index.html, sinon un rechargement sur une sous-page
    # donnerait une erreur 404.
    #
    # nginx choisit le prefixe le plus long : /api/ et /actuator/health
    # passent donc par les blocs ci-dessus, jamais par celui-ci.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # En-tetes de securite elementaires.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
}
