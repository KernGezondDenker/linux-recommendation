name: Publier les images

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        dossier: [catalog-service, recommendation-service]
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.dossier }}/pom.xml

      - name: Lancer les tests
        working-directory: ${{ matrix.dossier }}
        run: ./mvnw -B test

  publier:
    runs-on: ubuntu-latest
    needs: tests
    strategy:
      fail-fast: false
      matrix:
        include:
          - dossier: catalog-service
            image: linux-reco-catalog
          - dossier: recommendation-service
            image: linux-reco-recommendation
          - dossier: web
            image: linux-reco-web

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7
      - name: Mettre le nom du compte en minuscules
        id: compte
        run: echo "nom=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Préparer buildx
        uses: docker/setup-buildx-action@v3
      - name: S'authentifier auprès de ghcr.io
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Calculer les étiquettes
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ steps.compte.outputs.nom }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=sha
      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.dossier }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_RECOMMENDATION_URL=${{ vars.VITE_RECOMMENDATION_URL || 'http://localhost:8082' }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,scope=${{ matrix.image }},mode=max
