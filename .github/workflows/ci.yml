name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test-recommendation:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: recommendation-service/pom.xml

      - name: Lancer les tests
        working-directory: recommendation-service
        run: ./mvnw -B test

  test-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer le JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: catalog-service/pom.xml

      - name: Lancer les tests
        working-directory: catalog-service
        run: ./mvnw -B test


  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v7

      - name: Installer Node 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Installer les dépendances
        working-directory: web
        run: npm ci

      - name: Construire le front
        working-directory: web
        run: npm run build